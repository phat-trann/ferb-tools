<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FerbTools Setup</title>
    <style>
      :root {
        --bg: #eef2f7;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --surface-soft: #eff6ff;
        --border: rgba(148, 163, 184, 0.32);
        --border-strong: rgba(148, 163, 184, 0.42);
        --text: #172033;
        --text-strong: #0f172a;
        --text-muted: rgba(15, 23, 42, 0.62);
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: rgba(37, 99, 235, 0.12);
        --primary-border: rgba(37, 99, 235, 0.22);
        --success: #0f766e;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --info: #075985;
        --info-surface: #f0f9ff;
        --info-border: rgba(14, 165, 233, 0.16);
        --scroll-thumb: rgba(100, 116, 139, 0.34);
        --shadow-panel: 0 14px 32px rgba(15, 23, 42, 0.12);
        --shadow-button: 0 8px 16px rgba(37, 99, 235, 0.18);
        --font-xs: 10px;
        --font-sm: 11px;
        --font-md: 12px;
        --font-lg: 13px;
        color: var(--text);
        background: var(--bg);
        font-family: "Noto Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 390px;
        height: 560px;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .shell {
        height: 100%;
        padding: 10px;
      }

      .panel {
        position: relative;
        overflow: hidden;
        display: flex;
        height: 100%;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        background: var(--surface);
        box-shadow: var(--shadow-panel);
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex: 0 0 auto;
      }

      .brand-copy {
        display: grid;
        grid-template-columns: 42px 1fr;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 38px;
        height: 38px;
      }

      .eyebrow {
        margin: 0 0 5px;
        font-size: var(--font-xs);
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--primary);
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1;
      }

      .credit {
        margin: 4px 0 0;
        font-size: var(--font-xs);
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .version-pill {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        background: var(--surface-muted);
        font-size: var(--font-sm);
        font-weight: 800;
      }

      .top-actions {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 10px;
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        z-index: 2;
        cursor: pointer;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .switch span {
        width: 44px;
        height: 26px;
        border-radius: 999px;
        background: #94a3b8;
        box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.18);
      }

      .switch .enable-transition + span {
        transition: background 160ms ease;
      }

      .switch span::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
      }

      .switch .enable-transition + span::after {
        transition: transform 160ms ease;
      }

      .switch input:checked + span {
        background: var(--primary);
      }

      .switch input:checked + span::after {
        transform: translateX(18px);
      }

      form {
        position: relative;
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: var(--font-sm);
        font-weight: 800;
        color: var(--text-muted);
        letter-spacing: 0.02em;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        padding: 0 10px;
        color: var(--text);
        background: rgba(255, 255, 255, 0.88);
        font: inherit;
        font-size: var(--font-lg);
        font-weight: 700;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-soft);
      }

      input,
      select {
        height: 36px;
      }

      textarea {
        min-height: 76px;
        max-height: 116px;
        overflow: auto;
        padding: 9px 10px;
        line-height: 1.45;
        resize: vertical;
      }

      .tool-grid,
      textarea,
      .report-preview {
        scrollbar-color: var(--scroll-thumb) transparent;
        scrollbar-width: thin;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .divider {
        height: 1px;
        margin: 4px 0;
        background: linear-gradient(90deg, transparent, var(--primary-soft), transparent);
      }

      .note {
        margin: -3px 0 0;
        overflow: hidden;
        color: var(--text-muted);
        font-size: var(--font-xs);
        font-weight: 700;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button {
        height: 38px;
        border: none;
        border-radius: 8px;
        color: var(--surface);
        background: var(--primary);
        box-shadow: var(--shadow-button);
        font: inherit;
        font-size: var(--font-md);
        font-weight: 900;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.42);
        outline-offset: 2px;
      }

      .tool-grid {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 8px;
        min-height: 0;
        margin-top: 10px;
        overflow-y: auto;
        padding-left: 4px;
        scrollbar-gutter: stable;
      }

      .tool-grid::-webkit-scrollbar,
      textarea::-webkit-scrollbar,
      .report-preview::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .tool-grid::-webkit-scrollbar-track,
      textarea::-webkit-scrollbar-track,
      .report-preview::-webkit-scrollbar-track {
        background: transparent;
      }

      .tool-grid::-webkit-scrollbar-thumb,
      textarea::-webkit-scrollbar-thumb,
      .report-preview::-webkit-scrollbar-thumb {
        border: 2px solid var(--surface);
        border-radius: 999px;
        background: var(--scroll-thumb);
      }

      textarea::-webkit-scrollbar-thumb,
      .report-preview::-webkit-scrollbar-thumb {
        border-color: rgba(255, 255, 255, 0.82);
      }

      .tool-card {
        display: block;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
        transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
      }

      .tool-card[open] {
        border-color: var(--primary-border);
        background: var(--surface);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .tool-card:not([open]):hover {
        border-color: var(--primary-border);
        background: var(--surface);
      }

      .tool-summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        min-height: 32px;
        list-style: none;
        cursor: pointer;
      }

      .tool-summary::-webkit-details-marker {
        display: none;
      }

      .summary-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 28px;
        justify-content: flex-end;
      }

      .expand-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        color: var(--text-muted);
        background: rgba(226, 232, 240, 0.86);
        font-size: 16px;
        font-weight: 900;
      }

      details[open] .expand-pill {
        transform: rotate(90deg);
      }

      .tool-card h2 {
        margin: 0;
        color: var(--text-strong);
        font-size: var(--font-lg);
        line-height: 1.2;
        white-space: nowrap;
      }

      .tool-button {
        min-width: 70px;
        height: 32px;
        padding: 0 10px;
        color: var(--surface);
        background: var(--primary);
        box-shadow: var(--shadow-button);
      }

      .tool-setup {
        display: grid;
        gap: 10px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .list-run-row {
        grid-template-columns: 1fr 96px;
        align-items: end;
      }

      .tool-setup-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tool-setup-title h3 {
        margin: 0;
        color: var(--text-strong);
        font-size: var(--font-md);
        line-height: 1.2;
      }

      .compact-button {
        height: 34px;
        padding: 0 10px;
      }

      button:disabled {
        opacity: 0.72;
        cursor: default;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .config-button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .danger-button {
        color: var(--surface);
        background: var(--danger);
        box-shadow: 0 8px 16px rgba(185, 28, 28, 0.18);
      }

      .danger-button:hover:not(:disabled) {
        background: var(--danger-hover);
      }

      .status {
        display: flex;
        align-items: center;
        flex: 0 0 24px;
        height: 24px;
        margin: 8px;
        margin-left: 4px;
        overflow: hidden;
        padding: 0 8px;
        border: 1px solid var(--info-border);
        border-radius: 8px;
        background: var(--info-surface);
        font-size: var(--font-xs);
        font-weight: 700;
        line-height: 1;
        color: var(--info);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status[hidden] {
        display: flex;
        visibility: hidden;
      }

      .report-block {
        display: grid;
        gap: 6px;
      }

      .report-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: var(--font-sm);
        font-weight: 900;
        color: var(--text-muted);
      }

      .report-copy-button {
        width: auto;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--primary-border);
        color: var(--primary-hover);
        background: var(--surface-soft);
        box-shadow: none;
        font-size: var(--font-xs);
      }

      .report-copy-button:hover:not(:disabled) {
        color: var(--surface);
        background: var(--primary);
      }

      .report-preview {
        min-height: 86px;
        max-height: 118px;
        overflow: auto;
        padding: 8px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: var(--font-sm);
        font-weight: 600;
        line-height: 1.35;
      }

      .report-preview:empty::before {
        content: "No data";
        color: var(--text-muted);
      }

    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-label="FerbTools setup">
        <div class="brand">
          <div class="brand-copy">
            <img class="brand-logo" src="../icons/icon-128.png" width="42" height="42" alt="" aria-hidden="true">
            <div>
              <p class="eyebrow">Tool hub</p>
              <h1>FerbTools</h1>
              <p class="credit">Made by Ferb</p>
            </div>
          </div>
          <div class="top-actions">
            <span id="version" class="version-pill">v1.10.4</span>
          </div>
        </div>

        <p id="status" class="status" role="status" hidden></p>

        <section class="tool-grid" aria-label="FerbTools menu">
          <details class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Check-in Reminder</h2>
              </div>
              <span class="summary-actions">
                <label class="switch" title="Bật hoặc tắt Check-in Reminder">
                  <input id="enabled" type="checkbox">
                  <span aria-hidden="true"></span>
                </label>
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <form id="settings-form" class="tool-setup">
              <div class="tool-setup-title">
                <h3>Setup</h3>
              </div>
              <label>
                Giờ vào muộn nhất
                <input id="latest-checkin-time" type="time" required>
              </label>

              <div class="grid">
                <label>
                Thời lượng
                  <input id="work-duration-hours" type="number" min="0.5" max="24" step="0.25" required>
                </label>

                <label>
                  Làm tròn
                  <select id="rounding-slot-minutes">
                    <option value="15">15 phút</option>
                    <option value="30">30 phút</option>
                    <option value="60">60 phút</option>
                  </select>
                </label>
              </div>

              <div class="divider" aria-hidden="true"></div>

              <label>
                Check-in hôm nay
                <input id="today-checkin-time" type="time">
              </label>
              <p id="today-checkin-note" class="note">Chưa có dữ liệu check-in hôm nay.</p>

              <div class="button-row">
                <button id="save-button" type="submit">Lưu</button>
                <button id="clear-today-button" class="danger-button" type="button">Xóa ngày</button>
              </div>
            </form>
          </details>

          <details class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Content Asset Export</h2>
              </div>
              <span class="summary-actions">
                <button id="content-asset-button" class="tool-button" type="button">Run</button>
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <div class="tool-setup">
              <div class="tool-setup-title">
                <h3>Setup</h3>
              </div>
              <label>
                Locales
                <textarea id="content-asset-locales" spellcheck="false"></textarea>
              </label>
              <label>
                Site map JSON
                <textarea id="content-asset-site-map" spellcheck="false"></textarea>
              </label>
              <div class="config-button-row">
                <button id="content-asset-save-button" class="compact-button" type="button">Lưu</button>
                <button id="content-asset-reset-button" class="compact-button danger-button" type="button">Reset</button>
              </div>
            </div>
          </details>

          <details class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Content Asset List Export</h2>
              </div>
              <span class="summary-actions">
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <div class="tool-setup">
              <label>
                Content asset IDs
                <textarea id="content-asset-list-ids" spellcheck="false"></textarea>
              </label>
              <label>
                File name
                <input id="content-asset-list-filename" type="text">
              </label>
              <div class="grid list-run-row">
                <label>
                  Parallel
                  <input id="content-asset-list-concurrency" type="number" min="1" max="10" step="1">
                </label>
                <button id="content-asset-list-button" class="compact-button" type="button">Run</button>
              </div>
            </div>
          </details>

          <details id="jira-report-section" class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Jira Report</h2>
              </div>
              <span class="summary-actions">
                <button id="jira-report-generate-button" class="tool-button" type="button">Generate</button>
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <div class="tool-setup">
              <div class="report-block">
                <div class="report-header">
                  <span>Work Plan</span>
                  <button id="jira-report-copy-work-button" class="report-copy-button" type="button">Copy</button>
                </div>
                <div id="jira-report-work-preview" class="report-preview" contenteditable="true"></div>
              </div>
              <div class="report-block">
                <div class="report-header">
                  <span>Result</span>
                  <button id="jira-report-copy-result-button" class="report-copy-button" type="button">Copy</button>
                </div>
                <div id="jira-report-result-preview" class="report-preview" contenteditable="true"></div>
              </div>
            </div>
          </details>
        </section>

      </section>
    </main>

    <script src="../features/content-asset/config.js"></script>
    <script src="../features/check-in/popup.js"></script>
    <script src="../features/content-asset/popup.js"></script>
    <script src="../features/jira-report/popup.js"></script>
    <script src="../app/popup.js"></script>
  </body>
</html>
