<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FerbTools Setup</title>
    <style>
      :root {
        color: #102019;
        background: #fff7ed;
        font-family: "Noto Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 390px;
        margin: 0;
        background: linear-gradient(145deg, #f8fafc 0%, #ecfeff 46%, #fff7ed 100%);
      }

      .shell {
        padding: 14px;
      }

      .panel {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 18px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow:
          0 18px 44px rgba(15, 23, 42, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-copy {
        display: grid;
        grid-template-columns: 42px 1fr;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: #c2410c;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1;
      }

      .credit {
        margin: 6px 0 0;
        font-size: 12px;
        font-weight: 700;
        color: rgba(15, 23, 42, 0.58);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .version-pill {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 10px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 999px;
        color: #334155;
        background: #f8fafc;
        font-size: 12px;
        font-weight: 800;
      }

      .top-actions {
        display: grid;
        grid-template-columns: auto auto;
        align-items: center;
        gap: 10px;
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        z-index: 2;
        cursor: pointer;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .switch span {
        width: 58px;
        height: 34px;
        border-radius: 999px;
        background: #94a3b8;
        box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.18);
        transition: background 160ms ease;
      }

      .switch span::after {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: #fff7ed;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
        transition: transform 160ms ease;
      }

      .switch input:checked + span {
        background: #0f766e;
      }

      .switch input:checked + span::after {
        transform: translateX(24px);
      }

      form {
        position: relative;
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 800;
        color: rgba(15, 23, 42, 0.72);
        letter-spacing: 0.02em;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.36);
        border-radius: 10px;
        padding: 0 14px;
        color: #102019;
        background: rgba(255, 255, 255, 0.82);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #0f766e;
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
      }

      input,
      select {
        height: 46px;
      }

      textarea {
        min-height: 82px;
        padding: 12px 14px;
        line-height: 1.45;
        resize: vertical;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .divider {
        height: 1px;
        margin: 4px 0;
        background: linear-gradient(90deg, transparent, rgba(15, 118, 110, 0.28), transparent);
      }

      .note {
        margin: -5px 0 0;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.45;
        color: rgba(15, 23, 42, 0.62);
      }

      button {
        height: 48px;
        border: none;
        border-radius: 10px;
        color: #fff7ed;
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        box-shadow: 0 18px 34px rgba(15, 118, 110, 0.28);
        font: inherit;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
      }

      .tool-grid {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .tool-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 12px;
        background: rgba(248, 250, 252, 0.84);
      }

      details.tool-card {
        display: block;
      }

      .tool-summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        list-style: none;
        cursor: pointer;
      }

      .tool-summary::-webkit-details-marker {
        display: none;
      }

      .summary-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .expand-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        color: #334155;
        background: rgba(226, 232, 240, 0.86);
        font-size: 16px;
        font-weight: 900;
      }

      details[open] .expand-pill {
        transform: rotate(90deg);
      }

      .tool-card h2 {
        margin: 0;
        color: #0f172a;
        font-size: 14px;
        line-height: 1.2;
      }

      .tool-card p {
        margin: 5px 0 0;
        color: rgba(15, 23, 42, 0.62);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
      }

      .tool-button {
        min-width: 86px;
        height: 38px;
        padding: 0 12px;
        color: #f8fafc;
        background: linear-gradient(135deg, #2563eb, #0891b2);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
      }

      .tool-setup {
        display: grid;
        gap: 12px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
      }

      .tool-setup-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tool-setup-title h3 {
        margin: 0;
        color: #0f172a;
        font-size: 13px;
        line-height: 1.2;
      }

      .compact-button {
        height: 38px;
        padding: 0 12px;
      }

      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
      }

      .section-title h2 {
        margin: 0;
        color: #0f172a;
        font-size: 14px;
        line-height: 1.2;
      }

      .section-title span {
        color: rgba(15, 23, 42, 0.52);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      button:disabled {
        opacity: 0.72;
        cursor: default;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .config-button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .danger-button {
        color: #fff7ed;
        background: linear-gradient(135deg, #b91c1c, #ef4444);
        box-shadow: 0 18px 34px rgba(185, 28, 28, 0.24);
      }

      .status {
        min-height: 0;
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid rgba(14, 165, 233, 0.18);
        border-radius: 10px;
        background: rgba(240, 249, 255, 0.82);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
        color: #075985;
      }

      .status[hidden] {
        display: none;
      }

    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-label="FerbTools setup">
        <div class="brand">
          <div class="brand-copy">
            <img class="brand-logo" src="../icons/icon-128.png" width="42" height="42" alt="" aria-hidden="true">
            <div>
              <p class="eyebrow">Tool hub</p>
              <h1>FerbTools</h1>
              <p class="credit">Made by Ferb</p>
            </div>
          </div>
          <div class="top-actions">
            <span id="version" class="version-pill">v1.5.1</span>
          </div>
        </div>

        <p id="status" class="status" role="status" hidden></p>

        <section class="tool-grid" aria-label="FerbTools menu">
          <details class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Check-in Reminder</h2>
              </div>
              <span class="summary-actions">
                <label class="switch" title="Bật hoặc tắt Check-in Reminder">
                  <input id="enabled" type="checkbox">
                  <span aria-hidden="true"></span>
                </label>
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <form id="settings-form" class="tool-setup">
              <div class="tool-setup-title">
                <h3>Setup</h3>
              </div>
              <label>
                Giờ vào muộn nhất
                <input id="latest-checkin-time" type="time" required>
              </label>

              <div class="grid">
                <label>
                  Duration (giờ)
                  <input id="work-duration-hours" type="number" min="0.5" max="24" step="0.25" required>
                </label>

                <label>
                  Làm tròn
                  <select id="rounding-slot-minutes">
                    <option value="15">15 phút</option>
                    <option value="30">30 phút</option>
                    <option value="60">60 phút</option>
                  </select>
                </label>
              </div>

              <div class="divider" aria-hidden="true"></div>

              <label>
                Giờ check-in hôm nay
                <input id="today-checkin-time" type="time">
              </label>
              <p id="today-checkin-note" class="note">Chưa có dữ liệu check-in hôm nay.</p>

              <div class="button-row">
                <button id="save-button" type="submit">Lưu setup</button>
                <button id="clear-today-button" class="danger-button" type="button">Xóa hôm nay</button>
              </div>
            </form>
          </details>

          <details class="tool-card">
            <summary class="tool-summary">
              <div>
                <h2>Content Asset Export</h2>
              </div>
              <span class="summary-actions">
                <button id="content-asset-button" class="tool-button" type="button">Run</button>
                <span class="expand-pill" aria-hidden="true">›</span>
              </span>
            </summary>
            <div class="tool-setup">
              <div class="tool-setup-title">
                <h3>Setup</h3>
              </div>
              <label>
                Locales
                <textarea id="content-asset-locales" spellcheck="false"></textarea>
              </label>
              <label>
                Site mapping JSON
                <textarea id="content-asset-site-map" spellcheck="false"></textarea>
              </label>
              <div class="config-button-row">
                <button id="content-asset-save-button" class="compact-button" type="button">Lưu config</button>
                <button id="content-asset-reset-button" class="compact-button danger-button" type="button">Reset</button>
              </div>
            </div>
          </details>
        </section>

      </section>
    </main>

    <script src="../features/content-asset/config.js"></script>
    <script src="../features/check-in/popup.js"></script>
    <script src="../features/content-asset/popup.js"></script>
    <script src="../app/popup.js"></script>
  </body>
</html>
